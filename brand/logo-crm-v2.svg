<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <linearGradient id="g-crm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Big icon: dashboard grid (4 cards) -->
  <rect x="40" y="40" width="200" height="200" rx="44" fill="url(#g-crm)"/>
  <g transform="translate(70 70)">
    <rect x="0" y="0" width="62" height="62" rx="10" fill="#fff" opacity="0.95"/>
    <rect x="78" y="0" width="62" height="62" rx="10" fill="#fff" opacity="0.7"/>
    <rect x="0" y="78" width="62" height="62" rx="10" fill="#fff" opacity="0.7"/>
    <rect x="78" y="78" width="62" height="62" rx="10" fill="#fff" opacity="0.5"/>
  </g>
  <!-- Wordmark -->
  <text x="276" y="138" font-family="ui-serif, 'Instrument Serif', Georgia, serif"
        font-size="76" font-weight="400" fill="#0f172a" letter-spacing="-2">
    Contractor <tspan font-style="italic" fill="#6366f1">Flow</tspan>
  </text>
  <text x="280" y="220" font-family="ui-sans-serif, 'Inter', system-ui"
        font-size="72" font-weight="700" fill="#4f46e5" letter-spacing="-2">
    CRM
  </text>
  <text x="446" y="218" font-family="ui-sans-serif, 'Geist Mono', monospace"
        font-size="18" fill="#64748b" letter-spacing="2.5" font-weight="500">
    THE DASHBOARD THAT RUNS YOUR DAY
  </text>
</svg>
