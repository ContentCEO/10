<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <linearGradient id="g-lp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <!-- Big icon: rocket -->
  <rect x="40" y="40" width="200" height="200" rx="44" fill="url(#g-lp)"/>
  <g transform="translate(140 76) rotate(-20)">
    <!-- Rocket body -->
    <path d="M0 -42 C18 -42 24 -16 24 16 L24 50 L-24 50 L-24 16 C-24 -16 -18 -42 0 -42 Z"
          fill="#fff" opacity="0.96"/>
    <!-- Window -->
    <circle cx="0" cy="-4" r="9" fill="#f97316"/>
    <!-- Fins -->
    <path d="M-24 18 L-46 50 L-24 50 Z" fill="#fff" opacity="0.85"/>
    <path d="M24 18 L46 50 L24 50 Z" fill="#fff" opacity="0.85"/>
    <!-- Flame -->
    <path d="M-14 50 L0 90 L14 50 Z" fill="#fef3c7" opacity="0.95"/>
    <path d="M-8 56 L0 78 L8 56 Z" fill="#fff" opacity="0.7"/>
  </g>
  <!-- Wordmark -->
  <text x="276" y="138" font-family="ui-serif, 'Instrument Serif', Georgia, serif"
        font-size="76" font-weight="400" fill="#0f172a" letter-spacing="-2">
    Contractor <tspan font-style="italic" fill="#6366f1">Flow</tspan>
  </text>
  <text x="280" y="220" font-family="ui-sans-serif, 'Inter', system-ui"
        font-size="72" font-weight="700" fill="#ea580c" letter-spacing="-2">
    Launchpad
  </text>
  <text x="638" y="218" font-family="ui-sans-serif, 'Geist Mono', monospace"
        font-size="18" fill="#64748b" letter-spacing="2.5" font-weight="500">
    SITE · ADS · LEADS
  </text>
</svg>
