name: tauri-release-marketplace

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args:    "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args:    "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args:    ""
          - platform: "windows-latest"
            args:    ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install JS deps
        run: npm install --no-audit --no-fund

      # Unsigned build (default). Signed builds use a separate workflow,
      # keyed off the optional APPLE_* / WINDOWS_* secrets when set.
      - name: Build & release (unsigned, no updater)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName:        ${{ github.ref_name }}
          releaseName:    "Contractor Flow Marketplace ${{ github.ref_name }}"
          releaseBody:    "Real Massachusetts contractor leads — desktop app. See assets below."
          releaseDraft:   false
          prerelease:     false
          args:           ${{ matrix.args }}
